<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiny Notes</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Tailwind CSS -->

    <!-- Stylesheets: tailwind-fallback.css provides 100% offline support -->
    <link rel="stylesheet" href="css/tailwind-fallback.css">
    <link rel="stylesheet" href="css/styles.css">

    <!-- Optional online Tailwind CDN (safe to remove if you never want network requests) -->
    <script src="https://cdn.tailwindcss.com" defer></script>

    <!-- App Scripts (loaded in order with defer; works offline via file:// without a server) -->
    <script src="js/01-config-state.js" defer></script>
    <script src="js/02-storage-sync.js" defer></script>
    <script src="js/03-menus.js" defer></script>
    <script src="js/04-selection-drag.js" defer></script>
    <script src="js/05-render-init.js" defer></script>

</head>

<body>

    <!-- Tailwind Preload for dynamic classes -->
    <div
        class="hidden tiny fine small medium large huge giant text-[8px] text-[10px] text-[12px] text-xs text-[14px] text-sm text-[16px] text-base text-[18px] text-lg text-[19px] text-[22px] text-xl text-2xl text-blue-500 text-red-500 text-green-500 text-yellow-500 text-purple-500 text-teal-500 text-gray-800 text-pink-500 text-gray-300 text-zinc-900 text-orange-500 text-slate-400 bg-blue-500 bg-red-500 bg-green-500 bg-yellow-500 bg-purple-500 bg-teal-500 bg-gray-500 bg-pink-400 bg-gray-300 bg-zinc-900 bg-orange-500 bg-white/40 border-blue-500 border-red-500 border-green-500 border-yellow-500 border-purple-500 border-teal-500 border-gray-800 border-pink-500 border-gray-300 border-zinc-900 border-orange-500 border-slate-400 border-t-[3px] border-b-[3px] border-l-[3px] border-r-[3px] border-y-[3px] border-x-[3px] border-l-0 border-r-0 border-t-0 border-b-0 rounded-l-xl rounded-r-xl rounded-t-xl rounded-b-xl border-[3px] min-w-[170px] min-w-[195px] min-w-[220px] min-w-[235px] gap-3 bg-blue-50/50 hover:bg-blue-50/80">
    </div>

    <div id="workspace">

        <div id="btn-grid" class="thumbtack" title="Board Size" role="button" tabindex="0"
            aria-label="Board size settings">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="3" y1="15" x2="21" y2="15"></line>
                <line x1="9" y1="3" x2="9" y2="21"></line>
                <line x1="15" y1="3" x2="15" y2="21"></line>
            </svg>
        </div>
        <div id="btn-colors" class="thumbtack" title="Board & Title Colors" role="button" tabindex="0"
            aria-label="Board and title colors settings">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
                <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
                <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
                <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.38 0 2.5-1.12 2.5-2.5 0-.53-.21-1.04-.59-1.41-.35-.38-.51-.9-.37-1.43.29-1.01 1.28-1.66 2.39-1.66H17c2.76 0 5-2.24 5-5 0-4.42-4.48-8-10-8z" />
            </svg>
        </div>
        <div id="btn-note-style" class="thumbtack" title="Note Style" role="button" tabindex="0"
            aria-label="Note style settings">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <circle cx="12" cy="12" r="4" />
            </svg>
        </div>
        <div id="btn-trash" class="thumbtack" title="Delete selected notes (or drop notes here)" role="button" tabindex="0"
            aria-label="Delete notes">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"></path>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        </div>
        <div id="btn-info" class="thumbtack" title="About Tiny Notes" role="button" tabindex="0"
            aria-label="About Tiny Notes">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-4" />
                <path d="M12 8h.01" />
            </svg>
        </div>

        <div id="btn-load" class="thumbtack" title="Load File">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 11.5V5a2 2 0 0 1 2-2h5.5l2 2h7.5a2 2 0 0 1 2 2v9.5a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2Z"></path>
                <path d="M2 11.5h20"></path>
            </svg>
        </div>

        <div id="btn-save" class="thumbtack" title="Save File">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
        </div>

        <div id="btn-sync" class="thumbtack" title="Sync with a file" role="button" tabindex="0"
            aria-label="Sync with a file">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                <path d="M16 16h5v5"></path>
            </svg>
        </div>

        <!-- Title: Moved up slightly using negative margin -->
        <div id="title-container" class="relative z-[85] cursor-default">
            <div class="font-medium text-center tracking-wide font-sans outline-none p-1 px-4 rounded-lg transition-colors text-gray-800 text-base cursor-pointer hover:bg-gray-50 no-select"
                dir="auto">Tiny Notes</div>
        </div>

        <!-- Grid Space -->
        <div id="puzzle-grid"></div>
    </div>

    <!-- Hidden File Input -->
    <input type="file" id="file-input" class="hidden" accept=".json">

    <div id="about-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-[3000] p-4"
        role="dialog" aria-modal="true" aria-labelledby="about-title">
        <div class="bg-white p-6 rounded-xl shadow-lg w-80 max-w-full text-center relative">
            <button id="close-about" class="absolute top-3 right-4 text-gray-500 hover:text-gray-800 text-xl font-bold"
                type="button" aria-label="Close">×</button>
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                <img id="about-app-icon" alt="Tiny Notes" class="w-full h-full p-1 object-contain">
            </div>
            <h2 id="about-title" class="text-xl font-bold mb-2 text-gray-800">Tiny Notes 6</h2>
            <p class="text-sm text-gray-600 mb-4 leading-relaxed">A flexible note board for organizing ideas. Add notes
                to the grid, move and arrange them easily, and customize the board to suit your workflow.</p>
            <div class="w-16 h-1 bg-blue-500 mx-auto mb-4 rounded-full"></div>
            <p class="text-sm text-gray-700 mb-1">Developed by <strong>Mohammadali Honarvar</strong></p>
            <p class="text-xs text-blue-600 mb-4"><a href="mailto:honarvarma@gmail.com"
                    class="hover:underline">honarvarma@gmail.com</a></p>
            <p class="text-[10px] text-gray-400 border-t pt-3 mt-2">© 2026 All rights reserved for Mohammadali Honarvar</p>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu"
        class="absolute bg-white border border-gray-300 shadow-2xl rounded-xl w-max z-[1000] overflow-y-auto max-h-[80vh] text-sm text-gray-800 text-left transition-opacity duration-150 hidden">
    </div>

</body>

</html>
