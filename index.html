<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiny Notes</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Layout tuning: edit these values to adjust spacing and sizing. */
        :root {
            --window-padding-vertical: 0px;
            --window-padding-horizontal: 0px;
            --grid-horizontal-inset: 0px;
            /* Extra space beyond window and app padding.
            It only changes the cell size when width is limiting the board; if height is already the limiting factor, it may have no visible effect. */
            --grid-vertical-inset: 6px; 
            /* Extra space beyond window and app padding. */
            --app-padding-top: 10px;
            --app-padding-bottom: 20px;
            --app-padding-horizontal: 20px;
            --header-grid-gap: 0px;
            --cell-size: 80px;
            --grid-column-gap: 0px;
            --grid-row-gap: 0px;
            --cell-size-min: 20px;
            --cell-size-max: 160px;
            /* The responsive layout shrinks cells to fit smaller screens. */
            --stone-inset: 5px;
            /* Space inside each cell around its stone. */
            --selected-stone-lift: 0px;
            --selected-stone-scale: 1.0;
            --cell-height: var(--cell-size);
            --cell-padding-top: 0px;
            --plate-extra-h: 0px;
        }

        /* Cell dimming settings: 0 is invisible, 1 is fully visible. */
        :root {
            --full-dim-opacity: 0.28;
        }

        body {
            margin: 0;
            padding: var(--window-padding-vertical) var(--window-padding-horizontal);
            width: 100vw;
            height: var(--visible-viewport-height, 100vh);
            position: fixed;
            top: var(--visible-viewport-top, 0px);
            left: 0;
            box-sizing: border-box;
            background-color: var(--page-background, #e5e7eb);
            background-image: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.12) 42%, transparent 76%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }

        #workspace {
            width: fit-content;
            height: fit-content;
            max-width: 100%;
            max-height: 100%;
            background-color: var(--workspace-background, #ffffff);
            border-radius: 12px;
            box-shadow: 0 0 24px #0f172a33, 0 0 8px rgba(15, 23, 42, 0.12);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--app-padding-top) var(--app-padding-horizontal) var(--app-padding-bottom);
            box-sizing: border-box;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.2s ease-in;
        }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* ── GAME-BOARD style (default) ── */
        .stone-effect {
            border-radius: 50%;
            background-image: none;
            box-shadow:
                inset 0px 0px 5px 2px rgba(255, 255, 255, 0.5),
                inset 0px 0px 0px 2px rgba(255, 255, 255, 0.5),
                0px 0px 4px 1px rgba(125, 125, 125, 0.5),
                0px 0px 0px 1px rgba(125, 125, 125, 0.5);
            transition: all 0.2s ease-out;
        }

        .stone-effect-active {
            box-shadow:
                inset 0px 0px 5px 2px rgba(255, 255, 255, 0.5),
                inset 0px 0px 0px 2px rgba(255, 255, 255, 0.5),
                0px 0px 10px 5px rgba(125, 125, 125, 0.5);
            transform: translateY(calc(var(--selected-stone-lift) * -1)) scale(var(--selected-stone-scale));
            transition: all 0.2s ease-out;
            z-index: 6;
        }

        .note-engraved-text {
            color: #ffffff;
            font-weight: 600;
            text-shadow:
                0 0 2px rgba(255, 255, 255, 0.62),
                0 0 5px rgba(255, 255, 255, 0.28),
                0 0 2px rgba(0, 0, 0, 0.95),
                0 0 4px rgba(0, 0, 0, 0.75);
            padding-top: calc(0.5rem - 0.08em);
            padding-bottom: calc(0.5rem + 0.08em);
        }

        /* ── NATURAL style ── applied when body has class 'style-natural' ── */
        body.style-natural .stone-effect {
            box-shadow:
                inset -6px -6px 12px rgba(30, 40, 50, 0.7),
                inset 4px 4px 8px rgba(255, 255, 255, 0.35),
                inset -1px -1px 3px rgba(255, 255, 255, 0.2),
                2px 4px 8px rgba(0, 0, 0, 0.3);
        }

        body.style-natural .stone-effect-active {
            box-shadow:
                inset -6px -6px 14px rgba(30, 40, 50, 0.8),
                inset 4px 4px 10px rgba(255, 255, 255, 0.4),
                4px 8px 18px rgba(0, 0, 0, 0.38);
            transform: translateY(calc(var(--selected-stone-lift) * -1)) scale(var(--selected-stone-scale));
            z-index: 6;
        }

        body.style-natural .note-engraved-text {
            color: rgba(255, 255, 255, 0.95);
            text-shadow: -1px -1px 2px rgba(0, 0, 0, 0.6), 1px 1px 1px rgba(255, 255, 255, 0.5);
        }

        /* ── TRAFFIC LIGHT style ── applied when body has class 'style-traffic' ── */
        body.style-traffic .stone-effect {
            /* Clean, modern signal lamp bezel + gentle glass lens reflection */
            box-shadow:
                0 0 0 2px rgba(24, 28, 35, 0.85),
                inset 0 1.5px 3.5px rgba(255, 255, 255, 0.38),
                inset 0 -2px 5px rgba(0, 0, 0, 0.35),
                0 2px 5px rgba(0, 0, 0, 0.22);
            background-image:
                radial-gradient(ellipse at 50% 20%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.08) 35%, transparent 65%);
        }

        body.style-traffic .stone-effect-active {
            box-shadow:
                0 0 0 2.5px rgba(18, 22, 28, 0.95),
                inset 0 2px 4.5px rgba(255, 255, 255, 0.48),
                inset 0 -2.5px 6px rgba(0, 0, 0, 0.42),
                0 4px 10px rgba(0, 0, 0, 0.32);
            background-image:
                radial-gradient(ellipse at 50% 20%, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.1) 35%, transparent 65%);
            transform: translateY(calc(var(--selected-stone-lift) * -1)) scale(var(--selected-stone-scale));
            z-index: 6;
        }

        body.style-traffic .note-engraved-text {
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
            letter-spacing: 0.01em;
        }

        /* ── Strike-through note styles (double line-through effect) ── */
        .note-line-through {
            text-decoration: line-through double !important;
            text-decoration-line: line-through !important;
            text-decoration-style: double !important;
            text-decoration-thickness: max(1px, 0.08em) !important;
            text-decoration-color: currentColor !important;
            opacity: 0.8 !important;
            animation: none !important;
        }

        .note-white.note-line-through,
        .note-white .note-line-through {
            text-decoration-color: #334155 !important;
        }

        /* ── CELL PLATE (Invisible: cells exist structurally, but are visually transparent) ── */
        .cell-plate-surface {
            display: none !important;
        }

        .grid-cell {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .grid-cell.cell-status-triple .underline-svg {
            animation: triple-urgent-blink 1s ease-in-out infinite;
        }

        @keyframes triple-urgent-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }

        @media (prefers-reduced-motion: reduce) {
            .grid-cell.cell-status-triple .underline-svg {
                animation: none;
            }
        }

        #multi-cell-selection-box {
            position: relative;
            width: 100%;
            height: 100%;
            align-self: stretch;
            justify-self: stretch;
            outline: 2px dashed var(--selection-ring-color, #eab308);
            outline-offset: -1px;
            border-radius: 14px;
            box-shadow: 0 0 10px color-mix(in srgb, var(--selection-ring-color, #eab308) 35%, transparent);
            pointer-events: none !important;
            box-sizing: border-box;
            z-index: 52;
            transition: opacity 0.15s ease;
        }

        body.is-dragging-stone #multi-cell-selection-box {
            opacity: 0.35;
        }

        /* Stones themselves are always static, horizontal and legible */
        .stone-effect {
            animation: none !important;
        }

        .cell-underline-dock {
            position: absolute;
            top: calc(var(--cell-size) - 18px);
            left: 50%;
            width: 56%;
            max-width: calc(100% - 8px);
            height: 18px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 8;
            box-sizing: border-box;
            border-radius: 9999px;
            transform: translateX(-50%);
            transition: opacity 0.2s ease;
        }

        .grid-cell:not(.cell-status-normal) .cell-underline-dock {
            background: var(--status-label-color);
        }

        body:not(.has-window-selection) .grid-cell.is-selected.cell-status-normal .cell-underline-dock {
            background: rgba(255, 255, 255, 0.82);
            color: #6b7280;
            font-size: 12px;
            line-height: 12px;
        }

        body:not(.has-window-selection) .grid-cell.is-selected.cell-status-normal .cell-underline-dock::after {
            content: 'STATUS';
        }

        .grid-cell.cell-status-single { --status-label-color: #f59e0b; }
        .grid-cell.cell-status-double { --status-label-color: #f97316; }
        .grid-cell.cell-status-triple { --status-label-color: #ef4444; }
        .grid-cell.cell-status-dashed { --status-label-color: #d946ef; }
        .grid-cell.cell-status-wave { --status-label-color: #4f46e5; }
        .grid-cell.cell-status-sleep { --status-label-color: #0ea5e9; }
        .grid-cell.cell-status-checkmark { --status-label-color: #22c55e; }

        .grid-cell.cell-status-sleep .stone-wrapper,
        .grid-cell.cell-status-sleep .cell-timer-dock,
        .grid-cell.cell-status-checkmark .stone-wrapper,
        .grid-cell.cell-status-checkmark .cell-timer-dock {
            opacity: var(--full-dim-opacity);
        }

        .grid-cell.weekday-dimmed .stone-wrapper,
        .grid-cell.weekday-dimmed .cell-timer-dock,
        .grid-cell.weekday-dimmed .cell-underline-dock {
            opacity: var(--full-dim-opacity);
        }

        .grid-cell.cell-status-sleep .cell-underline-dock,
        .grid-cell.cell-status-checkmark .cell-underline-dock {
            opacity: 1;
        }

        .grid-cell.is-selected .stone-wrapper,
        .grid-cell.is-selected .cell-timer-dock,
        .grid-cell.is-selected .cell-underline-dock {
            opacity: 1;
        }

        .cell-timer-dock {
            position: absolute;
            top: 0;
            left: 50%;
            width: 7ch;
            max-width: calc(100% - 8px);
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            z-index: 8;
            box-sizing: border-box;
            border-radius: 9999px;
            transform: translateX(-50%);
            font-size: 12px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 1px 5px rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(2px);
            font-weight: 500;
            line-height: 12px;
            padding: 0 2px;
            color: #6b7280;
            border: 0;
        }

        .cell-timer-dock:not(.has-weekday) {
            background: none;
            box-shadow: none;
            backdrop-filter: none;
        }

        body:not(.has-window-selection) .grid-cell.is-selected .cell-timer-dock:not(.has-weekday) {
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 1px 5px rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(2px);
        }

        body:not(.has-window-selection) .grid-cell.is-selected .cell-timer-dock:not(.has-weekday)::after {
            content: 'DAYS';
        }

        .cell-timer-dock * {
            pointer-events: none;
        }

        .cell-timer-dock span {
            transform: translateY(-1px);
        }

        .grid-cell.cell-status-normal .cell-underline-dock .underline-svg {
            display: none !important;
        }

        .underline-svg {
            display: block;
            overflow: visible;
            max-width: 85%;
            max-height: 100%;
            color: #f59e0b;
            /* Golden amber matching user sketch */
            transition: opacity 0.2s ease, filter 0.2s ease, transform 0.2s ease;
        }

        .underline-svg [stroke] {
            stroke: #ffffff;
        }

        #context-menu {
            position: fixed !important;
            z-index: 1000 !important;
            box-sizing: border-box;
            width: max-content !important;
            background: #ffffff;
            background-color: #ffffff;
            opacity: 1;
            border: 1px solid rgba(209, 213, 219, 0.85);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.16), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
            max-height: 80vh;
        }

        /* Thumbtack menus: 100% opaque, no transparency */
        #context-menu.menu-thumbtack,
        #context-menu[data-menu-type="grid"],
        #context-menu[data-menu-type="colors"],
        #context-menu[data-menu-type="style"] {
            opacity: 1 !important;
            background: #ffffff !important;
            background-color: #ffffff !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        /* Grid cell menus: keep transparency */
        #context-menu.menu-cell,
        #context-menu.menu-opacity-90,
        #context-menu[data-menu-type="status"],
        #context-menu[data-menu-type="color"] {
            opacity: 0.9 !important;
            background: rgba(255, 255, 255, 0.9) !important;
            background-color: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
        }

        #context-menu[data-menu-type="status"],
        #context-menu[data-menu-type="sleep"],
        #context-menu[data-menu-type="weekday"],
        #context-menu[data-menu-type="font"] {
            opacity: 1 !important;
            background: #ffffff !important;
            background-color: #ffffff !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        .menu-font-container,
        .menu-option-container {
            min-width: 175px;
            width: max-content;
            padding: 8px 0;
            box-sizing: border-box;
        }

        #context-menu[data-menu-type="status"] .menu-option-container,
        #context-menu[data-menu-type="weekday"] .menu-option-container {
            min-width: 0;
        }

        .menu-font-item,
        .menu-option-item {
            padding: 7px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .menu-font-item:hover,
        .menu-option-item:hover {
            background-color: rgba(239, 246, 255, 0.9);
        }

        button.menu-option-item {
            width: 100%;
            border: 0;
            text-align: left;
        }

        .menu-font-container {
            min-width: 0;
        }

        .menu-font-item {
            gap: 10px;
        }

        .menu-color-palette {
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(6, 26px);
            gap: 8px;
            width: max-content;
            box-sizing: border-box;
        }

        .menu-panel-container {
            padding: 12px 16px;
            box-sizing: border-box;
        }

        .title-text-effect {
            text-shadow: 0 1px 3px rgba(15, 23, 42, 0.3);
        }

        .note-white {
            background-color: #eff7ff;
        }

        .note-stone-gray {
            background-color: #a8a29e;
        }

        .dragging {
            opacity: 0.85 !important;
        }

        .thumbtack {
            width: 24px;
            height: 24px;
            min-width: 24px;
            min-height: 24px;
            aspect-ratio: 1;
            background: radial-gradient(circle at 35% 30%, #4b5563 0%, #273244 52%, #111827 100%);
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.38);
            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.32),
                inset 0 1px 3px rgba(255, 255, 255, 0.3),
                inset 0 -3px 6px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            z-index: 85;
            position: relative;
            flex: 0 0 24px;
        }

        .thumbtack:hover {
            transform: scale(1.15);
            color: #ffffff;
            background: radial-gradient(circle at 35% 30%, #64748b 0%, #334155 52%, #172033 100%);
        }

        .thumbtack:active {
            transform: scale(0.95);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35), inset 0 2px 6px rgba(0, 0, 0, 0.5), inset 0 0 4px rgba(255, 255, 255, 0.25);
        }

        .thumbtack:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 3px;
        }

        .thumbtack.trash-drop-target,
        .thumbtack.trash-drop-target:hover {
            transform: scale(1.25);
            color: #ffffff;
            background: radial-gradient(circle at 35% 30%, #f87171 0%, #dc2626 52%, #991b1b 100%);
            border-color: rgba(254, 202, 202, 0.9);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.75), inset 0 1px 3px rgba(255, 255, 255, 0.45);
        }

        .thumbtack svg {
            width: 12px;
            height: 12px;
            stroke-width: 2.5;
            color: #ffffff;
        }

        .thumbtack.sync-paused {
            background: radial-gradient(circle at 35% 30%, #fde047 0%, #eab308 52%, #a16207 100%);
            border-color: rgba(254, 240, 138, 0.9);
        }

        .thumbtack.sync-unsaved {
            background: radial-gradient(circle at 35% 30%, #f87171 0%, #dc2626 52%, #991b1b 100%);
            border-color: rgba(254, 202, 202, 0.9);
        }

        .thumbtack.sync-working {
            background: radial-gradient(circle at 35% 30%, #3b82f6 0%, #1d4ed8 52%, #1e3a8a 100%);
            border-color: rgba(147, 197, 253, 0.85);
        }

        .thumbtack.sync-ok {
            background: radial-gradient(circle at 35% 30%, #4ade80 0%, #16a34a 52%, #166534 100%);
            border-color: rgba(187, 247, 208, 0.9);
        }

        .title-menu-button {
            width: 28px;
            height: 28px;
            min-width: 28px;
            min-height: 28px;
            aspect-ratio: 1;
            box-sizing: border-box;
            border-radius: 50%;
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.25), inset 0 0 5px rgba(255, 255, 255, 0.95);
        }

        .title-menu-button svg,
        .title-menu-button span {
            color: #000000 !important;
            stroke: #000000;
        }

        /* ── Command buttons on stone (shown only when clicked / selected) ── */
        .stone-action-btn {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
            transition: opacity 0.15s ease, transform 0.15s ease, background-color 0.15s ease;
        }

        body:not(.has-window-selection):not(.is-marquee-selecting):not(.is-dragging-stone) .grid-cell.is-selected .stone-action-btn,
        body:not(.has-window-selection):not(.is-marquee-selecting):not(.is-dragging-stone) .grid-cell.has-menu .stone-action-btn,
        body:not(.has-window-selection):not(.is-marquee-selecting):not(.is-dragging-stone) .stone-action-btn.stone-menu-btn-visible {
            opacity: 1 !important;
            pointer-events: auto !important;
            visibility: visible !important;
            transform: scale(1);
            z-index: 25 !important;
        }

        .grid-cell.is-selected .stone-action-btn:hover,
        .grid-cell.has-menu .stone-action-btn:hover,
        .stone-action-btn.stone-menu-btn-visible:hover {
            transform: scale(1.15) !important;
            background-color: #f1f5f9;
        }

        .grid-cell {
            z-index: 10;
        }

        .grid-cell.is-selected {
            z-index: 50 !important;
        }

        .grid-cell.has-menu {
            z-index: 55 !important;
        }

        #context-menu {
            z-index: 1000 !important;
        }

        body.is-dragging-stone .stone-action-btn,
        body.is-marquee-selecting .stone-action-btn,
        body.has-window-selection .stone-action-btn,
        body.is-marquee-selecting .grid-cell .stone-action-btn,
        body.is-marquee-selecting .grid-cell.is-selected .stone-action-btn,
        body.has-window-selection .grid-cell .stone-action-btn,
        body.has-window-selection .grid-cell.is-selected .stone-action-btn {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        .app-header {
            position: relative;
            z-index: 80;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: clamp(8px, 2.2vw, 12px);
            width: 100%;
            margin-bottom: calc(var(--grid-row-gap) + var(--header-grid-gap));
        }

        .header-controls {
            position: relative;
            top: 1px;
            display: flex;
            gap: clamp(8px, 2.2vw, 12px);
            padding-inline: clamp(2px, 0.8vw, 4px);
            min-width: 0;
            z-index: 85;
        }

        .header-controls-right {
            justify-content: flex-end;
        }

        #title-container {
            position: relative;
            z-index: 85;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: max-content;
            max-width: 100%;
            min-width: 0;
            margin: 0;
            justify-self: center;
            cursor: default;
            opacity: 1;
        }

        #title-container>.title-text-element {
            box-sizing: border-box;
            width: max-content;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .title-action-btn {
            width: 24px;
            height: 24px;
            min-width: 24px;
            min-height: 24px;
            aspect-ratio: 1;
            box-sizing: border-box;
            border-radius: 50%;
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.22), inset 0 0 4px rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;

    <script>
        // Settings
        const TOMORROW_UNDIM_HOUR = 17; // From this hour (0-23), tomorrow's cells are no longer dimmed.

        // Icons - black on white
        const iconCheck = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-black pointer-events-none"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
        const iconEdit = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-black pointer-events-none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
        const iconTrash = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-black pointer-events-none"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"></path></svg>`;
        const iconPalette = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-black pointer-events-none"><circle cx="13.5" cy="6.5" r=".5" fill="#000000"></circle><circle cx="17.5" cy="10.5" r=".5" fill="#000000"></circle><circle cx="8.5" cy="7.5" r=".5" fill="#000000"></circle><circle cx="6.5" cy="12.5" r=".5" fill="#000000"></circle><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.38 0 2.5-1.12 2.5-2.5 0-.53-.21-1.04-.59-1.41C13.54 17.72 13.38 17.2 13.53 16.66 13.82 15.65 14.81 15 15.92 15H17c2.76 0 5-2.76 5-5 0-4.42-4.48-8-10-8z"></path></svg>`;
        const iconFont = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-black pointer-events-none"><path d="M2.5 19 7 5l4.5 14M4 14h6"></path><path d="M21 14.5c0-2.7-1.2-4.2-3.3-4.2s-3.3 1.5-3.3 4.2 1.2 4.5 3.3 4.5 3.3-1.8 3.3-4.5zM21 10.5V19"></path></svg>`;
        // Status menu icon (flag)
        const iconStatus =  `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-black pointer-events-none"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>`;
        const iconWeekday = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pointer-events-none"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>`;

        const statusModes = ['single', 'double', 'triple', 'dashed', 'wave', 'checkmark', 'sleep'];
                                        const statusClassNames = ['cell-status-sleep',      'cell-status-single', 'cell-status-double', 'cell-status-triple', 'cell-status-zigzag', 'cell-status-dotted', 'cell-status-dashed', 'cell-status-wave', 'cell-status-checkmark', 'cell-status-urgent', 'cell-status-priority', 'cell-status-important', 'cell-status-attention', 'cell-status-hold', 'cell-status-waiting', 'cell-status-completed', 'cell-status-conundrum'];

        function canonicalStatus(s) {
            if (!s || s === 'off' || s === 'none' || s === false) return null;
            const str = String(s).toLowerCase();
            if (str === 'single' || str === 'important') return 'single';
            if (str === 'double' || str === 'priority') return 'double';
            if (str === 'triple' || str === 'urgent') return 'triple';
            if (str === 'dashed' || str === 'hold' || str === 'waiting') return 'dashed';
            if (str === 'wave' || str === 'attention' || str === 'current') return 'wave';
            if (str === 'checkmark' || str === 'completed' || str === 'done' || str === 'linethrough') return 'checkmark';
            if (str === 'sleep') return 'sleep';
            return statusModes.includes(str) ? str : null;
        }

        function getNoteStatuses(noteOrStatuses) {
            if (!noteOrStatuses) return [];
            let rawList = [];
            if (Array.isArray(noteOrStatuses)) {
                rawList = noteOrStatuses;
            } else if (typeof noteOrStatuses === 'object') {
                if (Array.isArray(noteOrStatuses.statuses)) rawList = noteOrStatuses.statuses;
                else if (Array.isArray(noteOrStatuses.status)) rawList = noteOrStatuses.status;
                else if (noteOrStatuses.status) rawList = [noteOrStatuses.status];
                else if (noteOrStatuses.blinking) rawList = [noteOrStatuses.blinking];
            } else if (typeof noteOrStatuses === 'string') {
                rawList = [noteOrStatuses];
            }
            const result = [];
            rawList.forEach(item => {
                const c = canonicalStatus(item);
                if (c && !result.includes(c)) result.push(c);
            });
            return result.slice(0, 1);
        }

        function updateNoteStatusDisplay(index) {
            if (!notes[index]) return;
            const cell = document.getElementById(`grid-cell-${index}`);
            if (!cell) return;
            const dock = cell.querySelector('.cell-underline-dock');
            if (dock) dock.innerHTML = getUnderlineHtml(notes[index]);
            const activeStatuses = getNoteStatuses(notes[index]);
            cell.classList.remove(...statusClassNames, 'cell-status-normal');
            cell.classList.add(activeStatuses.length > 0 ? `cell-status-${activeStatuses[0]}` : 'cell-status-normal');
        }

function getUnderlineHtml(noteOrStatuses) {
            const list = getNoteStatuses(noteOrStatuses);
            if (!list || list.length === 0) return '';
            let paths = '';
            // ==============================================================
            // STATUS COLOR REFERENCE FOR EASY SWAPPING
            // ==============================================================
            // Amber:    #f59e0b  |  border-amber-300
            // Orange:   #f97316  |  border-orange-300
            // Red:      #ef4444  |  border-red-300
            // Fuchsia:  #d946ef  |  border-fuchsia-300
            // Indigo:   #4f46e5  |  border-indigo-300
            // Sky Blue: #0ea5e9  |  border-sky-300
            // Green:    #22c55e  |  border-green-300
            // White:    #ffffff  |  border-gray-400 (Used for "None")
            // ==============================================================

            // 1. Single (amber #f59e0b) - single horizontal line
            if (list.includes('single')) {
                paths += `<line x1="5.0" y1="8.5" x2="49.0" y2="8.5" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round"/>`;
            }
            
            // 2. Double (orange #f97316) - 2 horizontal lines
            if (list.includes('double')) {
                paths += `<line x1="7" y1="6.0" x2="47" y2="6.0" stroke="#f97316" stroke-width="1.9" stroke-linecap="round"/>

            const rootStyles = getComputedStyle(document.documentElement);
            const columnGapSize = columnGap;
            const rowGapSize = rowGap;
            const minCellSize = parseFloat(rootStyles.getPropertyValue('--cell-size-min')) || 24;

            const maxCellW = (availW - (totalCols - 1) * columnGapSize) / totalCols;

        function normalizeImportedData(rawData) {
            if (!rawData || typeof rawData !== 'object' || Array.isArray(rawData) || !Array.isArray(rawData.notes)) {
                throw new Error('Unsupported save format');
            }

            let parsedCols = null;
            let parsedRows = null;

            if (Number.isInteger(rawData.cols) && Number.isInteger(rawData.rows) && rawData.cols >= 1 && rawData.rows >= 1) {
                parsedCols = rawData.cols;
                parsedRows = rawData.rows;
            } else if (Number.isInteger(rawData.totalCols) && Number.isInteger(rawData.totalRows) && rawData.totalCols >= 1 && rawData.totalRows >= 1) {
                parsedCols = rawData.totalCols;
                parsedRows = rawData.totalRows;
            } else if (Number.isInteger(rawData.coreCols) && Number.isInteger(rawData.coreRows) && rawData.coreCols >= 1 && rawData.coreRows >= 1) {
                const mL = Number.isInteger(rawData.mL) ? rawData.mL : 0;
                const mR = Number.isInteger(rawData.mR) ? rawData.mR : 0;
                const mT = Number.isInteger(rawData.mT) ? rawData.mT : 0;
                const mB = Number.isInteger(rawData.mB) ? rawData.mB : 0;
                parsedCols = mL + rawData.coreCols + mR;
                parsedRows = mT + rawData.coreRows + mB;
            } else {
                throw new Error('Unsupported save format');
            }

            if (rawData.notes.length !== parsedCols * parsedRows) throw new Error('Unsupported save format');

            return {
                totalCols: parsedCols,
                totalRows: parsedRows,
                columnGap: Number.isFinite(rawData.columnGap) ? Math.round(Math.max(0, Math.min(100, rawData.columnGap))) : 0,
                rowGap: Number.isFinite(rawData.rowGap) ? Math.round(Math.max(0, Math.min(100, rawData.rowGap))) : 0,
                notes: rawData.notes,
                titleState: rawData.titleState || null,
                titleColorVersion: rawData.titleColorVersion || null,
                pageColorIndex: Number.isInteger(rawData.pageColorIndex) ? rawData.pageColorIndex : null,
                workspaceColorIndex: Number.isInteger(rawData.appColorIndex) ? rawData.appColorIndex : null,
                cellStyle: rawData.cellStyle || null
            };
        }

        function applyLoadedData(data) {
            totalCols = data.totalCols; totalRows = data.totalRows;
            columnGap = data.columnGap;
            rowGap = data.rowGap;
            notes = data.notes;
            notes.forEach(n => {
                if (n) {
                    delete n.statusTimer;
                    if (n.opacity !== undefined) delete n.opacity;
                    if (n.blinking && !n.status) n.status = n.blinking;
                    if (n.status === 'completed' || n.status === 'done' || n.status === 'linethrough') {
                        n.status = 'completed';
                        delete n.strike;
                    }
                    n.statuses = getNoteStatuses(n);
                    if (n.statuses.length > 0) {
                        n.status = n.statuses[0];
                    } else {
                        delete n.status;
                    }
                    delete n.blinking;
                    delete n.strike;
                }
            });
            if (data.titleState) {
                let loadedTitle = { ...data.titleState };
                if (loadedTitle.text === 'Note Stones') loadedTitle.text = 'Tiny Notes';
                if (!data.titleColorVersion && Number.isInteger(loadedTitle.colorIndex) && loadedTitle.colorIndex >= 0 && loadedTitle.colorIndex < 12) {
                    const titlePaletteMap = [11, 10, 4, 5, 6, 8, 7, 9, 3, 2, 1, 0];
                    loadedTitle.colorIndex = titlePaletteMap[loadedTitle.colorIndex];
                }
                titleState = { ...titleState, ...loadedTitle, isMenuOpen: false, isEditing: false };
            }
            if (data.pageColorIndex !== null && data.pageColorIndex >= 0 && data.pageColorIndex < pageColors.length) pageColorIndex = data.pageColorIndex;
            if (data.workspaceColorIndex !== null && data.workspaceColorIndex >= 0 && data.workspaceColorIndex < workspaceColors.length) workspaceColorIndex = data.workspaceColorIndex;

            applyBackgroundColors();
            applyStyleSettings();
        }

        function loadData() {

        const LOCAL_MODIFIED_KEY = 'tinyNotesLocalModified';
        const formatSyncTime = (ms) => ms ? new Date(ms).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : 'unknown';
        const getLocalModified = () => Number(localStorage.getItem(LOCAL_MODIFIED_KEY)) || 0;
        const hasLocalNotes = () => notes.some(Boolean);

        let syncFileHandle = null;
        let syncWriteTimer = null;
        let syncChain = Promise.resolve();
        let syncKnownModified = 0;
        let syncDirty = false;
        let syncPollTimer = null;
        let syncPaused = false;
        let syncUnsaved = false;

        // yellow = paused after reload, red = edited while paused, blue = writing, green = in sync
        function updateSyncIndicator() {
            const btn = document.getElementById('btn-sync');
            if (!btn) return;
            const state = syncFileHandle ? (syncDirty ? 'working' : 'ok') : (syncPaused ? (syncUnsaved ? 'unsaved' : 'paused') : '');
            ['paused', 'unsaved', 'working', 'ok'].forEach(s => btn.classList.toggle('sync-' + s, s === state));
        }

        function runSyncTask(task) {
            syncChain = syncChain.then(task).catch((err) => {
                if (syncFileHandle) {
                    setSyncHandle(null);
                    alert('Syncing stopped: the file could not be accessed.');
                }
            });
            return syncChain;
        }

        function scheduleSyncWrite() {
            if (!syncFileHandle) return;
            syncDirty = true;
            updateSyncIndicator();
            clearTimeout(syncWriteTimer);
            syncWriteTimer = setTimeout(() => runSyncTask(syncWithFile), 400);
        }

        async function writeSyncFile(handle) {
            const writable = await handle.createWritable();
            await writable.write(JSON.stringify(getSaveObject()));
            await writable.close();
            syncKnownModified = (await handle.getFile()).lastModified;
            syncDirty = false;
            updateSyncIndicator();
        }

        function applySyncedText(text) {
            const data = normalizeImportedData(JSON.parse(text));
            const wasSyncing = syncFileHandle;
            syncFileHandle = null;
            applyLoadedData(data);
            editingIndex = null;
            activeMenuIndex = null;
            selectedNotes.clear();
            saveData(); resizeGrid(); renderTitle(); renderGrid();
            syncFileHandle = wasSyncing;
            syncDirty = false;
            updateSyncIndicator();
        }

        // Two-way step: pull the file if it changed elsewhere, push local changes otherwise
        async function syncWithFile() {
            const handle = syncFileHandle;
            if (!handle || editingIndex !== null || titleState.isEditing) return;
            const file = await handle.getFile();
            if (file.lastModified > syncKnownModified) {
                let text = '';
                let valid = false;
                try { text = await file.text(); JSON.parse(text); valid = true; } catch (e) { }
                if (valid) {
                    const useFile = !syncDirty || window.confirm(`The sync file was changed elsewhere and you also have unsynced changes here.\n\nFile changed: ${formatSyncTime(file.lastModified)}\nYour changes: ${formatSyncTime(getLocalModified())}\n\nOK = use the file version (discard my changes)\nCancel = keep my version (overwrite the file)`);
                    if (useFile) {
                        syncKnownModified = file.lastModified;
                        applySyncedText(text);
                        return;
                    }
                }
                await writeSyncFile(handle);
            } else if (syncDirty) {
                await writeSyncFile(handle);
            }
        }

        function setSyncHandle(handle) {
            syncFileHandle = handle;
            clearInterval(syncPollTimer);
            syncPollTimer = null;
            syncDirty = false;
            syncPaused = false;
            syncUnsaved = false;
            const btn = document.getElementById('btn-sync');
            btn.title = handle ? `Syncing with ${handle.name} (click to stop)` : 'Sync with a file';
            if (handle) syncPollTimer = setInterval(() => runSyncTask(syncWithFile), 4000);
            updateSyncIndicator();
        }

        const SYNC_PICKER_TYPES = [{ description: 'Tiny Notes file', accept: { 'application/json': ['.json'] } }];
        let rememberedSyncHandle = null;

        function openSyncDb() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('tinyNotesSync', 1);
                request.onupgradeneeded = () => request.result.createObjectStore('handles');
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function storeSyncHandle(handle) {
            try {
                const db = await openSyncDb();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction('handles', 'readwrite');
                    if (handle) tx.objectStore('handles').put(handle, 'file');
                    else tx.objectStore('handles').delete('file');
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
                db.close();
            } catch (e) { }
        }

        async function loadStoredSyncHandle() {
            try {
                const db = await openSyncDb();
                const handle = await new Promise((resolve, reject) => {
                    const request = db.transaction('handles').objectStore('handles').get('file');
                    request.onsuccess = () => resolve(request.result || null);
                    request.onerror = () => reject(request.error);
                });
                db.close();
                return handle;
            } catch (e) { return null; }
        }

        function stopFileSync() {
            setSyncHandle(null);
            rememberedSyncHandle = null;
            storeSyncHandle(null);
        }

        // Loads the file first; local data is only written over it when the user chooses so
        async function beginSyncWithHandle(handle, isNewFile = false) {
            const file = await handle.getFile();
            let text = '';
            let valid = false;
            if (file.size > 0) {
                try { text = await file.text(); JSON.parse(text); valid = true; } catch (e) { }
                if (!valid && !window.confirm('This file is not a Tiny Notes file. Overwrite it with the current board?')) return;
            }
            let loadFile = valid && !isNewFile;
            if (loadFile && hasLocalNotes() && getLocalModified() > file.lastModified
                && JSON.stringify(JSON.parse(text)) !== JSON.stringify(getSaveObject())) {
                loadFile = window.confirm(`This board has changes that are not in the file.\n\nFile changed: ${formatSyncTime(file.lastModified)}\nYour changes: ${formatSyncTime(getLocalModified())}\n\nOK = load the file (discard my changes)\nCancel = keep my board and overwrite the file`);
            }
            rememberedSyncHandle = handle;
            storeSyncHandle(handle);
            setSyncHandle(handle);
            await runSyncTask(async () => {
                if (loadFile) {
                    syncKnownModified = file.lastModified;
                    applySyncedText(text);
                } else {
                    await writeSyncFile(handle);
                }
            });
        }

        async function chooseSyncFile(mode) {
            try {
                if (mode === 'new') {
                    const handle = await window.showSaveFilePicker({ suggestedName: 'TinyNotes.json', types: SYNC_PICKER_TYPES });
                    await beginSyncWithHandle(handle, true);
                } else {
                    // The save picker empties an existing file, so existing files use the open picker
                    const [handle] = await window.showOpenFilePicker({ types: SYNC_PICKER_TYPES });
                    if (await handle.requestPermission({ mode: 'readwrite' }) !== 'granted') return;
                    await beginSyncWithHandle(handle);
                }
            } catch (err) { /* picker cancelled */ }
        }

        async function resumeRememberedSync() {
            try {
                const handle = rememberedSyncHandle;
                if (!handle || await handle.requestPermission({ mode: 'readwrite' }) !== 'granted') return;
                await beginSyncWithHandle(handle);
            } catch (err) { stopFileSync(); }
        }

        function showSyncMenu(anchorElement) {
            activeHeaderMenu = 'sync';
            contextMenu.dataset.menuType = 'sync';
            contextMenu.classList.remove('menu-opacity-90', 'menu-cell');
            contextMenu.classList.add('menu-thumbtack');
            contextMenu.style.opacity = '1';
            contextMenu.style.backgroundColor = '#ffffff';
            const items = [];
            if (rememberedSyncHandle) items.push({ label: `Resume with ${rememberedSyncHandle.name}`, action: resumeRememberedSync });
            if (window.showOpenFilePicker) items.push({ label: 'Choose existing file…', action: () => chooseSyncFile('existing') });
            if (window.showSaveFilePicker) items.push({ label: 'Create new file…', action: () => chooseSyncFile('new') });
            contextMenu.innerHTML = `<div class="menu-option-container select-none"></div>`;
            const container = contextMenu.firstChild;
            items.forEach(({ label, action }) => {
                const item = document.createElement('div');
                item.className = 'menu-option-item text-gray-800';
                item.textContent = label;
                item.addEventListener('click', () => { closeContextMenu(); action(); });
                container.appendChild(item);
            });
            positionMenu(0, 0, anchorElement);
        }

        async function restoreSyncOnStartup() {
            if (!window.showOpenFilePicker) return;
            const handle = await loadStoredSyncHandle();
            if (!handle) return;
            rememberedSyncHandle = handle;
            syncPaused = true;
            updateSyncIndicator();
            document.getElementById('btn-sync').title = `Sync paused - click to resume with ${handle.name}`;
            try {
                if (await handle.queryPermission({ mode: 'readwrite' }) === 'granted') await beginSyncWithHandle(handle);
            } catch (e) { }
        }
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && syncFileHandle) runSyncTask(syncWithFile);
        });
        window.addEventListener('focus', () => { if (syncFileHandle) runSyncTask(syncWithFile); });
        function saveData() {
            try {
                const json = JSON.stringify(getSaveObject());
                if (json !== localStorage.getItem(LOCAL_STORAGE_KEY)) localStorage.setItem(LOCAL_MODIFIED_KEY, String(Date.now()));
                localStorage.setItem(LOCAL_STORAGE_KEY, json);
            } catch (e) { }
            if (syncPaused && !syncUnsaved) { syncUnsaved = true; updateSyncIndicator(); }
            scheduleSyncWrite();
        }


        // Header menus management and staged grid sizing
        let activeHeaderMenu = null;
        let menuCloseTimer = null;
        let gridDraft = null;

        function scheduleMenuClose(delay = 120) {
            cancelMenuClose();
            menuCloseTimer = setTimeout(() => {
                closeContextMenu();
            }, delay);
        }

        function cancelMenuClose() {
            if (menuCloseTimer) {
                clearTimeout(menuCloseTimer);
                menuCloseTimer = null;
            }
        }

        function initGridDraft() {
            gridDraft = {
                initialCols: totalCols,
                initialRows: totalRows,
                cols: totalCols,
                rows: totalRows,
                notes: notes.slice(),
                isDirty: false
            };
        }

        function canDraftRemoveRow(side) {
            if (!gridDraft || gridDraft.rows <= 1) return false;
            const cols = gridDraft.cols;
            const rows = gridDraft.rows;
            if (side === 'top') {
                for (let c = 0; c < cols; c++) {
                    if (gridDraft.notes[c] !== null) return false;
                }
                return true;
            }
            const rowStart = (rows - 1) * cols;
            for (let c = 0; c < cols; c++) {
                if (gridDraft.notes[rowStart + c] !== null) return false;
            }
            return true;
        }

        function canDraftRemoveCol(side) {
            if (!gridDraft || gridDraft.cols <= 1) return false;
            const cols = gridDraft.cols;
            const rows = gridDraft.rows;
            if (side === 'left') {
                for (let r = 0; r < rows; r++) {
                    if (gridDraft.notes[r * cols] !== null) return false;
                }
                return true;
            }
            for (let r = 0; r < rows; r++) {
                if (gridDraft.notes[r * cols + cols - 1] !== null) return false;
            }
            return true;
        }

        window.draftAddEdge = function (side) {
            if (!gridDraft) initGridDraft();
            const cols = gridDraft.cols;
            const rows = gridDraft.rows;
            if (side === 'bottom') {
                gridDraft.notes = gridDraft.notes.concat(Array(cols).fill(null));
                gridDraft.rows++;
            } else if (side === 'top') {
                gridDraft.notes = Array(cols).fill(null).concat(gridDraft.notes);
                gridDraft.rows++;
            } else if (side === 'right') {
                const newNotes = [];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) newNotes.push(gridDraft.notes[r * cols + c]);
                    newNotes.push(null);
                }
                gridDraft.notes = newNotes;
                gridDraft.cols++;
            } else if (side === 'left') {
                const newNotes = [];
                for (let r = 0; r < rows; r++) {
                    newNotes.push(null);
                    for (let c = 0; c < cols; c++) newNotes.push(gridDraft.notes[r * cols + c]);
                }
                gridDraft.notes = newNotes;
                gridDraft.cols++;
            }
            gridDraft.isDirty = true;
            renderGridMenuContent();
        };

        window.draftRemoveEdge = function (side) {
            if (!gridDraft) initGridDraft();
            if (side === 'bottom') {
                if (!canDraftRemoveRow('bottom')) return;
                const rowStart = (gridDraft.rows - 1) * gridDraft.cols;
                gridDraft.notes = gridDraft.notes.slice(0, rowStart);
                gridDraft.rows--;
            } else if (side === 'top') {
                if (!canDraftRemoveRow('top')) return;
                gridDraft.notes = gridDraft.notes.slice(gridDraft.cols);
                gridDraft.rows--;
            } else if (side === 'right') {
                if (!canDraftRemoveCol('right')) return;
                const newNotes = [];
                const cols = gridDraft.cols;
                const rows = gridDraft.rows;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols - 1; c++) newNotes.push(gridDraft.notes[r * cols + c]);
                }
                gridDraft.notes = newNotes;
                gridDraft.cols--;
            } else if (side === 'left') {
                if (!canDraftRemoveCol('left')) return;
                const newNotes = [];
                const cols = gridDraft.cols;
                const rows = gridDraft.rows;
                for (let r = 0; r < rows; r++) {
                    for (let c = 1; c < cols; c++) newNotes.push(gridDraft.notes[r * cols + c]);
                }
                gridDraft.notes = newNotes;
                gridDraft.cols--;
            }
            gridDraft.isDirty = true;
            renderGridMenuContent();
        };


        function applyGridDraft() {
            if (!gridDraft || !gridDraft.isDirty) {
                gridDraft = null;
                return;
            }
            notes = gridDraft.notes;
            totalCols = gridDraft.cols;
            totalRows = gridDraft.rows;
            gridDraft = null;
            saveData();
            resizeGrid();
            renderGrid();
        }

        let activeMenuResizeObserver = null;
        let activeMenuPosState = null;

        function getActiveMenuStoneRect(anchorElement = null) {
            if (anchorElement && anchorElement.closest && anchorElement.closest('#group-action-toolbar')) {
                const box = document.getElementById('multi-cell-selection-box');
                if (box) return box.getBoundingClientRect();
            }
            if (anchorElement && anchorElement.closest) {
                const cell = anchorElement.closest('.grid-cell');
                const circle = cell?.querySelector('.stone-effect') || cell?.querySelector('.stone-wrapper');
                if (circle) return circle.getBoundingClientRect();
            }
            const nIdx = contextMenu.dataset.noteIndex;
            if (nIdx && nIdx !== 'title') {
                const cell = document.getElementById(`grid-cell-${nIdx}`);
                const circle = cell?.querySelector('.stone-effect') || cell?.querySelector('.stone-wrapper');
                if (circle) return circle.getBoundingClientRect();
            }
            if (activeMenuIndex !== null) {
                const cell = document.getElementById(`grid-cell-${activeMenuIndex}`);
                const circle = cell?.querySelector('.stone-effect') || cell?.querySelector('.stone-wrapper');
                if (circle) return circle.getBoundingClientRect();
            }
            return null;
        }

        function computeAndApplyMenuPosition() {
            if (!contextMenu || contextMenu.classList.contains('hidden') || !activeMenuPosState) return;
            const { x, y, anchorElement, alignMode } = activeMenuPosState;
            const margin = 10;
            const vv = window.visualViewport;
            const vpW = vv ? vv.width : (document.documentElement.clientWidth || window.innerWidth);
            const vpH = vv ? vv.height : (document.documentElement.clientHeight || window.innerHeight);
            const vpL = vv ? vv.offsetLeft : 0;
            const vpT = vv ? vv.offsetTop : 0;

            contextMenu.style.maxWidth = `${Math.max(0, vpW - 2 * margin)}px`;
            contextMenu.style.maxHeight = `${Math.max(0, vpH - 2 * margin)}px`;

            const rect = contextMenu.getBoundingClientRect();
            if (rect.width === 0 && rect.height === 0) return;

            const anchorRect = anchorElement ? anchorElement.getBoundingClientRect() : null;
            const stoneRect = getActiveMenuStoneRect(anchorElement);

            let posX, posY;
            if (alignMode === 'timer-left' || alignMode === 'timer-right') {
                const targetElement = selectedNotes.size > 1
                    ? document.getElementById('multi-cell-selection-box')
                    : document.getElementById(`grid-cell-${contextMenu.dataset.noteIndex}`);
                const targetRect = targetElement?.getBoundingClientRect() || stoneRect;
                if (!targetRect) return;
                const avoidAnchor = anchorRect && (contextMenu.dataset.menuType === 'weekday' || contextMenu.dataset.menuType === 'status');
                const leftEdge = Math.min(targetRect.left - 8, avoidAnchor ? anchorRect.left - 2 : Infinity);
                const rightEdge = Math.max(targetRect.right + 8, avoidAnchor ? anchorRect.right + 2 : -Infinity);
                const topEdge = Math.min(targetRect.top - 8, avoidAnchor ? anchorRect.top - 2 : Infinity);
                const bottomEdge = Math.max(targetRect.bottom + 8, avoidAnchor ? anchorRect.bottom + 2 : -Infinity);
                const spaceLeft = leftEdge - (vpL + margin);
                const spaceRight = vpL + vpW - margin - rightEdge;
                const spaceBelow = vpT + vpH - margin - bottomEdge;
                const spaceAbove = topEdge - (vpT + margin);

                if (spaceLeft >= rect.width || spaceRight >= rect.width) {
                    posX = spaceLeft >= rect.width && (alignMode === 'timer-left' || spaceRight < rect.width)
                        ? leftEdge - rect.width
                        : rightEdge;
                    posY = targetRect.top + (targetRect.height - rect.height) / 2;
                } else if (spaceBelow >= rect.height || spaceAbove >= rect.height) {
                    posX = targetRect.left + (targetRect.width - rect.width) / 2;
                    posY = spaceBelow >= rect.height
                        ? bottomEdge
                        : topEdge - rect.height;
                } else if (avoidAnchor && anchorRect.right + 2 + rect.width <= vpL + vpW - margin) {
                    posX = anchorRect.right + 2;
                    posY = anchorRect.top + (anchorRect.height - rect.height) / 2;
                } else if (avoidAnchor && anchorRect.left - 2 - rect.width >= vpL + margin) {
                    posX = anchorRect.left - 2 - rect.width;
                    posY = anchorRect.top + (anchorRect.height - rect.height) / 2;
                } else if (avoidAnchor && anchorRect.bottom + 2 + rect.height <= vpT + vpH - margin) {
                    posX = anchorRect.left + (anchorRect.width - rect.width) / 2;
                    posY = anchorRect.bottom + 2;
                } else if (avoidAnchor && anchorRect.top - 2 - rect.height >= vpT + margin) {
                    posX = anchorRect.left + (anchorRect.width - rect.width) / 2;
                    posY = anchorRect.top - 2 - rect.height;
                } else {
                    posX = spaceLeft >= spaceRight
                        ? leftEdge - rect.width
                        : rightEdge;
                    posY = targetRect.top + (targetRect.height - rect.height) / 2;
                }
            } else if (stoneRect && (alignMode === 'left' || alignMode === 'right')) {
                const spaceLeft = (stoneRect.left - 10) - (vpL + margin);
                const spaceRight = (vpL + vpW - margin) - (stoneRect.right + 10);
                const preferLeft = (alignMode === 'left');

                if (preferLeft && spaceLeft >= rect.width) {
                    posX = stoneRect.left - rect.width - 10;
                } else if (!preferLeft && spaceRight >= rect.width) {
                    posX = stoneRect.right + 10;
                } else if (spaceRight >= rect.width) {
                    posX = stoneRect.right + 10;
                } else if (spaceLeft >= rect.width) {
                    posX = stoneRect.left - rect.width - 10;
                } else {
                    const spaceBelow = (vpT + vpH - margin) - (stoneRect.bottom + 10);
                    if (spaceBelow >= rect.height) {
                        posY = stoneRect.bottom + 10;
                    } else {
                        posY = Math.max(vpT + margin, stoneRect.top - rect.height - 10);
                    }
                    posX = Math.min(Math.max(stoneRect.left + (stoneRect.width - rect.width) / 2, vpL + margin), vpL + vpW - rect.width - margin);
                }

                if (posY === undefined) {
                    const targetCenterY = anchorRect ? (anchorRect.top + anchorRect.height / 2) : (stoneRect.top + stoneRect.height / 2);
                    posY = targetCenterY - rect.height / 2;
                    posY = Math.min(Math.max(posY, vpT + margin), vpT + vpH - rect.height - margin);
                }
            } else if (alignMode === 'left') {
                const targetCenterY = anchorRect ? (anchorRect.top + anchorRect.height / 2) : (y - window.scrollY);
                posY = targetCenterY - rect.height / 2;

                const idealLeft = anchorRect ? (anchorRect.left - rect.width - 8) : (x - window.scrollX - rect.width - 8);
                if (idealLeft >= vpL + margin) {
                    posX = idealLeft;
                } else {
                    posX = anchorRect ? (anchorRect.right + 8) : (x - window.scrollX + 8);
                }
            } else if (alignMode === 'right') {
                const targetCenterY = anchorRect ? (anchorRect.top + anchorRect.height / 2) : (y - window.scrollY);
                posY = targetCenterY - rect.height / 2;

                const idealRight = anchorRect ? (anchorRect.right + 8) : (x - window.scrollX + 8);
                if (idealRight + rect.width <= vpL + vpW - margin) {
                    posX = idealRight;
                } else {
                    posX = anchorRect ? (anchorRect.left - rect.width - 8) : (x - window.scrollX - rect.width - 8);
                }
            } else if (alignMode === 'center') {
                const targetCenterX = anchorRect ? (anchorRect.left + anchorRect.width / 2) : (x - window.scrollX);
                const targetCenterY = anchorRect ? (anchorRect.top + anchorRect.height / 2) : (y - window.scrollY);
                posX = targetCenterX - rect.width / 2;
                posY = targetCenterY - rect.height / 2;
            } else if (anchorRect) {
                posX = anchorRect.left;
                posY = anchorRect.bottom + 8;
                // If it overflows bottom, flip above anchor if there is space
                if (posY + rect.height > vpT + vpH - margin && anchorRect.top - rect.height - 8 >= vpT + margin) {
                    posY = anchorRect.top - rect.height - 8;
                }
            } else {
                posX = x - window.scrollX;
                posY = y - window.scrollY;
            }

            // Clamping within viewport
            posX = Math.min(posX, vpL + vpW - rect.width - margin);
            posY = Math.min(posY, vpT + vpH - rect.height - margin);
            posX = Math.max(vpL + margin, posX);
            posY = Math.max(vpT + margin, posY);

            if (Math.abs(parseFloat(contextMenu.style.left) - posX) > 0.5) {
                contextMenu.style.left = `${posX}px`;
            }
            if (Math.abs(parseFloat(contextMenu.style.top) - posY) > 0.5) {
                contextMenu.style.top = `${posY}px`;
            }
        }

        function positionMenu(x, y, anchorElement = null, alignMode = 'default') {
            cancelMenuClose();
            if (activeMenuResizeObserver) {
                activeMenuResizeObserver.disconnect();
                activeMenuResizeObserver = null;
            }

            if ((x === null || x === undefined) && (y === null || y === undefined) && activeMenuPosState) {
                x = activeMenuPosState.x;
                y = activeMenuPosState.y;
            }
            if (!anchorElement && activeMenuPosState && activeMenuPosState.anchorElement) {
                anchorElement = activeMenuPosState.anchorElement;
            }

            activeMenuPosState = { x, y, anchorElement, alignMode };

            const vv = window.visualViewport;
            const vpW = vv ? vv.width : (document.documentElement.clientWidth || window.innerWidth);
            const vpH = vv ? vv.height : (document.documentElement.clientHeight || window.innerHeight);
            const vpL = vv ? vv.offsetLeft : 0;
            const vpT = vv ? vv.offsetTop : 0;
            const margin = 10;

            contextMenu.style.position = 'fixed';
            contextMenu.style.visibility = 'hidden';
            contextMenu.style.left = `${vpL}px`;
            contextMenu.style.top = `${vpT}px`;
            contextMenu.style.maxWidth = `${Math.max(0, vpW - 2 * margin)}px`;
            contextMenu.style.maxHeight = `${Math.max(0, vpH - 2 * margin)}px`;
            contextMenu.style.overflowX = 'auto';
            contextMenu.style.overflowY = 'auto';
            contextMenu.classList.remove('hidden');

            computeAndApplyMenuPosition();
            contextMenu.style.visibility = '';

            // Double check on subsequent animation frames to catch any late layout changes (Tailwind JIT, font loading, etc.)
            requestAnimationFrame(() => {
                computeAndApplyMenuPosition();
                requestAnimationFrame(computeAndApplyMenuPosition);
            });

            // Re-compute automatically if contextMenu dimensions change while open
            if (window.ResizeObserver) {
                let initial = true;
                activeMenuResizeObserver = new ResizeObserver(() => {
                    if (initial) { initial = false; return; }
                    computeAndApplyMenuPosition();
                });
                activeMenuResizeObserver.observe(contextMenu);
            }
        }

        function closeContextMenu() {
            cancelMenuClose();
            if (activeMenuResizeObserver) {
                activeMenuResizeObserver.disconnect();
                activeMenuResizeObserver = null;
            }
            activeMenuPosState = null;
            if (gridDraft && gridDraft.isDirty) {
                applyGridDraft();
            } else {
                gridDraft = null;
            }
            activeHeaderMenu = null;
            contextMenu.classList.add('hidden');
            contextMenu.classList.remove('menu-opacity-90', 'menu-cell', 'menu-thumbtack');
            contextMenu.style.opacity = '';
            contextMenu.style.backgroundColor = '';
            contextMenu.style.visibility = '';
            contextMenu.style.left = '0px';
            contextMenu.style.top = '0px';
            delete contextMenu.dataset.menuType;
            delete contextMenu.dataset.noteIndex;
            delete contextMenu.dataset.dockMenu;
            document.querySelectorAll('.grid-cell.has-menu').forEach(c => c.classList.remove('has-menu'));
            if (activeMenuIndex !== null && !selectedNotes.has(activeMenuIndex) && editingIndex === null) {
                activeMenuIndex = null;
                document.querySelectorAll('.stone-menu-btn-visible').forEach(b => b.classList.remove('stone-menu-btn-visible'));
            }
            return true;
        }


        const svgGrid = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>`;
        const svgSpacing = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 17h16"/><path d="m8 4-3 3 3 3M16 14l3 3-3 3"/></svg>`;

        function edgeBtnClass(canDo) {
            return canDo
                ? 'w-7 h-7 flex items-center justify-center rounded-lg text-xs font-semibold border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 cursor-pointer transition-all select-none'
                : 'w-7 h-7 flex items-center justify-center rounded-lg text-xs font-semibold border border-gray-200 bg-gray-100 text-gray-300 cursor-not-allowed select-none';
        }

        function renderGridMenuContent() {
            if (!gridDraft) initGridDraft();
            const canRmTop = canDraftRemoveRow('top'), canRmBot = canDraftRemoveRow('bottom');
            const canRmLeft = canDraftRemoveCol('left'), canRmRight = canDraftRemoveCol('right');
            const addBtn = (side, lbl) =>
                `<div class="${edgeBtnClass(true)}" onclick="event.stopPropagation(); draftAddEdge('${side}')">${lbl}</div>`;
            const remBtn = (side, lbl, ok) =>
                `<div class="${edgeBtnClass(ok)}"${ok ? ` onclick="event.stopPropagation(); draftRemoveEdge('${side}')"` : ''}>${lbl}</div>`;

            const sectionHead = (icon, text) =>
                `<div class="flex items-center gap-2 text-sm font-bold text-gray-700 mb-1.5 pb-1.5 border-b border-gray-200">${icon}<span>${text}</span></div>`;

            let html = `<div class="menu-panel-container flex flex-col items-center gap-2 cursor-default w-max">`;
            html += `<div class="w-full">${sectionHead(svgGrid, 'Board Size')}</div>`;

            // Top row: + further (above), − near center (below)
            html += `<div class="flex flex-col items-center gap-1">${addBtn('top', '+')}${remBtn('top', '−', canRmTop)}</div>`;

            // Middle: Left Col (+ then -), Center Box, Right Col (- then +)
            html += `<div class="flex items-center justify-center gap-2.5 my-0.5">`;
            // Left col: + is further (left), − is near center (right)
            html += `<div class="flex items-center gap-1">${addBtn('left', '+')}${remBtn('left', '−', canRmLeft)}</div>`;

            // Center Box
            const dCols = gridDraft.cols - gridDraft.initialCols;
            const dRows = gridDraft.rows - gridDraft.initialRows;
            const hasChanges = (dCols !== 0 || dRows !== 0) || gridDraft.isDirty;

            html += `<div class="px-3 py-1.5 rounded-xl bg-blue-50 border border-blue-200 text-center min-w-[72px] shadow-sm select-none">`;
            html += `<div class="text-[15px] font-bold text-blue-700 leading-tight">${gridDraft.cols} × ${gridDraft.rows}</div>`;
            html += `<div class="text-[10px] text-gray-400">cols × rows</div>`;

        function updateWeekdayDisplay(index) {
            const cell = document.getElementById(`grid-cell-${index}`);

            const days = getNoteWeekdays(notes[index]);
            const now = new Date();
            const sortedDays = days === 'everyday' ? [] : days.slice().sort((a, b) =>
                (a - now.getDay() + 7) % 7 - (b - now.getDay() + 7) % 7);
            const day = sortedDays[0];
            const distance = day === undefined ? 0 : (day - now.getDay() + 7) % 7;
            const visibleDistance = now.getHours() >= TOMORROW_UNDIM_HOUR ? 1 : 0;
            cell.classList.toggle('weekday-dimmed', editingIndex !== index && distance > visibleDistance);

        function getRectangularSelectionIndices(indices) {
            if (indices.length === 0) return [];
            const rows = indices.map((idx) => Math.floor(idx / totalCols));
            const cols = indices.map((idx) => idx % totalCols);
            const minRow = Math.min(...rows);
            const maxRow = Math.max(...rows);
            const minCol = Math.min(...cols);
            const maxCol = Math.max(...cols);
            const rectangle = [];

            for (let row = minRow; row <= maxRow; row++) {
                for (let col = minCol; col <= maxCol; col++) {
                    rectangle.push(row * totalCols + col);
                }
            }
            return rectangle;
        }

        function updateWindowSelection(clientX, clientY) {
            if (!windowSelection || !windowSelection.started) return;

            const left = Math.min(windowSelection.startX, clientX);
            const top = Math.min(windowSelection.startY, clientY);
            const right = Math.max(windowSelection.startX, clientX);
            const bottom = Math.max(windowSelection.startY, clientY);

            const selectedIndices = [];
            const totalCells = totalRows * totalCols;
            for (let idx = 0; idx < totalCells; idx++) {
                const cell = document.getElementById(`grid-cell-${idx}`);
                if (!cell) continue;
                const rect = cell.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const intersects = !(rect.right < left || rect.left > right || rect.bottom < top || rect.top > bottom);
                const overlapW = Math.max(0, Math.min(rect.right, right) - Math.max(rect.left, left));
                const overlapH = Math.max(0, Math.min(rect.bottom, bottom) - Math.max(rect.top, top));
                if ((centerX >= left && centerX <= right && centerY >= top && centerY <= bottom) ||
                    (intersects && overlapW > rect.width * 0.25 && overlapH > rect.height * 0.25)) {
                    selectedIndices.push(idx);
                }
            }
            setWindowSelectedNotes(getRectangularSelectionIndices(selectedIndices));
        }

            try {
                if (workspace.hasPointerCapture(selection.pointerId)) {
                    workspace.releasePointerCapture(selection.pointerId);
                }
            } catch (err) { }

            if (selection.started) {
                if (!wasCancelled) updateWindowSelection(pointerX, pointerY);
                if (!wasCancelled) {
                    suppressedMarqueeClickUntil = Date.now() + 150;
                    if (selectedNotes.size === 1) {

        function setupWindowSelection() {
            document.addEventListener('pointerdown', (event) => {

                if (event.target.closest('.app-header, #context-menu, #about-modal, .title-menu-button, .thumbtack, button, input, textarea, [contenteditable="true"], .btn-save, .cell-underline-dock, .cell-timer-dock')) return;

                const cell = event.target.closest('.grid-cell');
                if (cell) {
                    const cellIdx = parseInt(cell.id.replace('grid-cell-', ''), 10);
                    if (selectedNotes.size > 1 && selectedNotes.has(cellIdx)) {
                        return; // Cell is part of active window selection: allow dragging it!
                    }

                    const circle = cell.querySelector('.stone-effect');
                    if (circle) {
                        if (isPointInsideStone(circle, event.clientX, event.clientY)) {
                            return; // Only clicks strictly inside the stone circle belong to stone interactions
                        }
                    } else if (notes[cellIdx] === null) {
                        if (event.target.closest('.cell-add-icon')) {
                            return; // Clicking the '+' sign adds a note.
                        }
                    }
